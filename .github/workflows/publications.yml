name: Update publications

on:
  schedule:
    - cron: "37 11 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/update_publications.py
      - name: Propose changes for review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git diff --quiet && exit 0
          branch="publications-update"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$branch"
          git commit -am "Update publications from OpenAlex"
          git push --force origin "$branch"
          gh pr view "$branch" --json state --jq .state 2>/dev/null | grep -q OPEN || \
            gh pr create --head "$branch" --title "Update publications" \
              --body "New or changed papers from OpenAlex. Check them, then merge to publish. To correct one, edit scripts/publications.json."
